name: Build, Push and Deploy Backend

on:
  push:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for docker-compose and nginx configs)
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The VPS host keys are pinned instead of fetched with ssh-keyscan on
      # every run: a fetched key is trusted blindly, and the VPS fail2ban bans
      # the runner for the pre-auth connections ssh-keyscan opens.
      # Fingerprints (check on the VPS with ssh-keygen -lf /etc/ssh/ssh_host_*_key.pub):
      #   ED25519 SHA256:O61GIPvrJ4IR8IZG8Vd+uBWdBEF/FHKxiijwVrWObgo
      #   ECDSA   SHA256:PfzRK+BFbJz9pac3zDQd+wgeIt0UGqGQiIsS+UcS00s
      - name: Pin the VPS host keys
        env:
          VPS_IP: ${{ secrets.VPS_IP }}
        run: |
          mkdir -p ~/.ssh
          {
            echo "$VPS_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQH0Vd+v4URnvsJCr7PCo6qEDxv2PxLGUvJf2Hjefch"
            echo "$VPS_IP ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNediJ7b7unHRFItTtASa6IUqYGWTyiOTz/m05pEG3ZJlAVTfFncg88gCuoRhBkysFSNn02fFBSpmulygNUN+dA="
          } > ~/.ssh/known_hosts
          {
            echo "Host *"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config

      - name: Copy orchestration files to VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.VPS_IP }} "mkdir -p /srv/domfeliu/"
          scp -r docker-compose.yml infrastructure/ ${{ secrets.SSH_USER }}@${{ secrets.VPS_IP }}:/srv/domfeliu/

      - name: Deploy via SSH
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.VPS_IP }} "
            cd /srv/domfeliu &&
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            docker compose pull &&
            docker compose up -d
          "

      - name: Run Database Migrations
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.VPS_IP }} "
            docker exec domfeliu_api npx prisma migrate deploy
          "
